<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Minha Biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rosa-claro:#F8C9D5; --rosa:#F0789D; --pink:#E9437A; --vinho:#990B30; --coral:#F47C75;
  --laranja:#F45116; --creme:#FFF2EB; --quente:#FFF9F6; --muted:#B7566F; --ink:#5a0b22;
  --serif:'DM Serif Display','Playfair Display',Georgia,serif;
  --sans:'Poppins','Nunito',system-ui,-apple-system,sans-serif;
  --card:rgba(255,255,255,.42); --line:rgba(153,11,48,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--vinho);background:#FBD3DD;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
.hidden{display:none!important}
.ic{flex:none;vertical-align:middle}
img{max-width:100%}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--vinho);color:var(--creme);position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;z-index:40}
.logo{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 14px 10px}
.logo .fl{width:62px;height:62px}
.logo b{font-family:var(--serif);font-weight:400;font-size:30px;line-height:.95;margin-top:6px;letter-spacing:-.5px}
.logo small{font-size:11.5px;margin-top:10px;opacity:.92}
.nav{display:flex;flex-direction:column;gap:6px;padding:18px 16px 8px}
.nav a{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--creme);transition:.2s}
.nav a:hover{background:rgba(255,242,235,.12)}
.nav a.on{background:var(--rosa-claro);color:var(--vinho);font-weight:600}
.nav hr{border:0;border-top:1px solid rgba(255,242,235,.25);margin:10px 12px}
.promo{position:relative;margin:14px 18px 0;padding:18px 14px 16px;border-radius:18px;background:linear-gradient(160deg,#FBB4C5,#F69BB4);color:var(--vinho);display:block}
.promo svg.ic{display:block;margin:0 auto 4px}
.promo b{font-family:var(--serif);font-weight:400;font-size:18px;line-height:1.1;display:block;text-align:center}
.promo p{font-size:11.5px;margin:8px 0 0;line-height:1.35}
.promo .fl{position:absolute;right:-18px;bottom:-26px;width:62px;height:62px}
.side-waves{position:absolute;left:0;right:0;bottom:92px;height:200px;pointer-events:none}
.side-waves svg{width:100%;height:100%}
.side-user{margin-top:auto;position:relative;padding:14px 18px 20px;z-index:2}
.me{display:flex;align-items:center;gap:10px;width:100%;font-size:14px;font-weight:600;color:var(--creme)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--rosa-claro);color:var(--vinho);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.logout{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--creme);font-weight:500}
.menu-pop{position:absolute;left:14px;right:14px;bottom:76px;background:var(--quente);color:var(--vinho);border-radius:16px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.menu-pop a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500}
.menu-pop a:hover{background:var(--rosa-claro)}
.scrim{display:none}

.main{min-width:0;background:linear-gradient(180deg,#FACDD8 0%,#FCDDE3 55%,#FDE8EA 100%);min-height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:16px 32px 12px;position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#FACDD8 70%,rgba(250,205,216,0))}
.burger{display:none;width:44px;height:44px;border-radius:50%;background:var(--vinho);color:var(--creme);place-items:center}
.search{flex:1;max-width:760px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:0 20px;height:46px;color:var(--vinho)}
.search input{flex:1;border:0;background:none;outline:0;font-size:14px;min-width:0}
.search input::placeholder{color:#c27a8e}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px;position:relative}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--vinho);position:relative}
.icon-btn:hover{background:rgba(255,255,255,.5)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--laranja);border:2px solid #FACDD8}
.pill-btn{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 18px;border-radius:999px;background:#A6456A;color:#fff;font-size:13px;font-weight:600}
.pop{position:absolute;right:0;top:50px;width:320px;max-width:86vw;background:var(--quente);border-radius:18px;box-shadow:0 18px 40px rgba(153,11,48,.25);padding:14px;z-index:60}
.pop h4{font-family:var(--serif);font-weight:400;font-size:18px;margin:2px 4px 8px}
.pop a.row{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px}
.pop a.row:hover{background:var(--rosa-claro)}
.pop .cover{width:36px;border-radius:5px;flex:none}
.pop small{display:block;color:var(--muted);font-size:11px}
#view{padding:6px 32px 40px;max-width:1500px}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 24px;border-radius:999px;font-size:14px;font-weight:600;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-dark{background:var(--vinho);color:var(--creme)}
.btn-pink{background:var(--pink);color:#fff}
.btn-soft{background:#F9B3C6;color:var(--vinho)}
.btn-ghost{background:rgba(255,255,255,.55);color:var(--vinho);border:1px solid var(--line)}
.btn-danger{background:#fff;color:#b00020;border:1px solid #f0b3bd}
.btn-sm{height:36px;padding:0 16px;font-size:12.5px}
.btn-block{width:100%}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;min-height:300px;background:linear-gradient(120deg,#FBC6D3,#FBD4DC 60%,#F9C3D1);display:flex;align-items:center;padding:34px 40px}
.hero-text{position:relative;z-index:3;max-width:58%}
.hero h1{font-size:clamp(34px,4.6vw,60px);line-height:.98;color:var(--vinho);letter-spacing:-1px}
.hero p{font-size:clamp(14px,1.35vw,18px);color:var(--ink);margin:18px 0 24px;max-width:430px;line-height:1.5}
.spark{position:absolute;left:-22px;top:-8px;color:var(--laranja);font-size:30px}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:48%;z-index:1}
.stripes{position:absolute;right:0;top:0;bottom:0;width:100%;background:repeating-linear-gradient(90deg,#E8416F 0 20px,#FBCDD7 20px 36px,#C71E4C 36px 52px,#FBCDD7 52px 74px);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%);opacity:.95}
.hero-art .waves{position:absolute;right:-6%;bottom:-6%;width:100%;height:78%}
.hero-art .stack{position:absolute;right:4%;bottom:7%;width:min(66%,360px);z-index:2;filter:drop-shadow(0 18px 18px rgba(120,10,40,.25))}
.hero-art .big-fl{position:absolute;right:20%;top:6%;width:min(34%,170px);z-index:3;transform:rotate(-8deg);filter:drop-shadow(0 8px 8px rgba(120,10,40,.2))}

/* ---------- Seções ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h .fl{width:30px;height:30px}
.sec-h h2{font-size:26px;color:var(--vinho)}
.sec-h a.all{margin-left:auto;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:90px;padding:12px 8px;border-radius:18px;font-size:13px;font-weight:600;text-align:center;line-height:1.15;transition:.2s}
.chip:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(153,11,48,.18)}
.chip img{width:34px;height:34px;object-fit:cover;border-radius:50%}
.chip svg{width:34px;height:34px;stroke-width:1.7}
.chip-0{background:#F8C9D5;color:#7a1630}.chip-1{background:#F0789D;color:#6a0a22}
.chip-2{background:#FBCFC0;color:#a2381e}.chip-3{background:#EE6E96;color:#5c0a20}
.chip-4{background:#F68B5F;color:#5c1608}.chip-5{background:#F9CBD7;color:#7a1630}
.chip-6{background:#F0789D;color:#6a0a22}.chip-7{background:#FBD3C3;color:#a2381e}
.carousel{position:relative}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .bk{flex:0 0 clamp(150px,15.4%,210px);scroll-snap-align:start}
.car-btn{position:absolute;top:38%;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--vinho);display:grid;place-items:center;box-shadow:0 6px 16px rgba(153,11,48,.25);z-index:5}
.car-btn.l{left:-14px}.car-btn.r{right:-14px}
.grid-books{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}

/* ---------- Capa e card ---------- */
.cover{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#f4b9c9;box-shadow:0 8px 18px rgba(120,10,40,.22)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.gen{background:linear-gradient(150deg,var(--a),var(--c));color:var(--creme);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12% 10%;gap:6px}
.cover.gen strong{font-family:var(--serif);font-weight:400;font-size:clamp(15px,1.8vw,22px);line-height:1.05;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.cover.gen em{font-size:10.5px;font-style:normal;opacity:.9}
.cover.gen .gen-flower{width:30%;opacity:.95}
.bk{background:var(--card);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;transition:.2s}
.bk:hover{background:rgba(255,255,255,.62)}
.bk .cv{position:relative;display:block}
.fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--vinho);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.fav.on{color:var(--pink)}.fav.on svg{fill:currentColor}
.bk h3{font-family:var(--sans);font-size:13.5px;font-weight:600;line-height:1.25;margin-top:6px;color:var(--vinho);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bk .au{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.tag{display:inline-block;align-self:flex-start;background:#F7B6C6;color:var(--vinho);border-radius:999px;font-size:10.5px;font-weight:600;padding:2px 9px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read{display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:999px;background:#F9B3C6;color:var(--vinho);font-size:12.5px;font-weight:600;margin-top:4px}
.read:hover{background:var(--pink);color:#fff}

/* ---------- Destaque + Seus livros ---------- */
.duo{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin-top:26px}
.featured{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(120deg,#FBC7D4,#FBD9DF);padding:22px 26px;min-height:260px;display:flex;gap:26px;align-items:center}
.featured .cover{width:min(36%,190px);flex:none;transform:rotate(-3deg);border-radius:6px 12px 12px 6px}
.featured .info{position:relative;z-index:2}
.featured h3{font-size:30px;line-height:1.05}
.featured p{font-size:13px;color:var(--ink);margin:10px 0 10px;line-height:1.5;max-width:330px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.featured .waves{position:absolute;right:-10px;bottom:-10px;width:55%;height:70%;opacity:.95}
.featured .fl1{position:absolute;right:22px;top:12px;width:62px;z-index:2}
.featured .fl2{position:absolute;left:6px;bottom:2px;width:54px;z-index:3}
.card{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);border-radius:20px}
.mylist{padding:6px 16px}
.mylist .it{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.mylist .it:last-child{border:0}
.mylist .cover{width:50px;border-radius:5px;flex:none}
.mylist b{font-size:14px;display:block;font-weight:600}
.mylist small{color:var(--muted);font-size:12px}
.mylist .grow{flex:1;min-width:0}
.mylist .grow b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.strip{margin-top:26px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(250,196,210,.7);border-radius:26px;padding:16px 10px}
.strip div{display:flex;align-items:center;gap:14px;justify-content:center;padding:6px 14px;font-size:13px;font-weight:500;line-height:1.25;border-left:1px solid rgba(153,11,48,.25)}
.strip div:first-child{border:0}

.empty{text-align:center;padding:36px 20px;border-radius:20px;background:rgba(255,255,255,.45);color:var(--ink)}
.empty .fl{width:56px;margin:0 auto 8px}
.empty b{font-family:var(--serif);font-weight:400;font-size:22px;display:block;margin-bottom:4px}

/* ---------- Páginas internas ---------- */
.page-h{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0 18px}
.page-h h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.5px}
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a:hover{color:var(--vinho);text-decoration:underline}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters select,.field input,.field select,.field textarea,.in{height:42px;border-radius:14px;border:1.5px solid rgba(153,11,48,.2);background:rgba(255,255,255,.8);padding:0 14px;outline:0;font-size:14px;width:100%}
.filters select{width:auto;min-width:160px}
.field textarea{height:auto;padding:10px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.in:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(233,67,122,.18)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer}
.check input{accent-color:var(--pink);width:17px;height:17px}
.catcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.catcard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;font-weight:600;transition:.2s}
.catcard:hover{transform:translateY(-3px);box-shadow:0 12px 22px rgba(153,11,48,.18)}
.catcard .ci{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.55);display:grid;place-items:center;flex:none;overflow:hidden}
.catcard .ci img{width:100%;height:100%;object-fit:cover}
.catcard .ci svg{width:28px;height:28px}
.catcard small{display:block;font-weight:400;font-size:12px;opacity:.85}
.subs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.subs a{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.6);font-size:13px;font-weight:600}
.subs a:hover{background:var(--pink);color:#fff}
.more{display:flex;justify-content:center;margin:26px 0 0}

.detail{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:36px;margin-top:16px}
.detail .cover{box-shadow:0 18px 34px rgba(120,10,40,.3);border-radius:8px 16px 16px 8px}
.detail h1{font-size:clamp(32px,4.4vw,52px);line-height:1;margin:10px 0 6px}
.detail .by{font-size:16px;color:var(--muted);margin-bottom:14px}
.detail .desc{font-size:15px;line-height:1.7;color:var(--ink);max-width:680px;white-space:pre-line}
.detail .meta{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.detail .meta span{background:rgba(255,255,255,.6);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:500}
.detail .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}

/* ---------- Leitor ---------- */
.reader{height:100vh;height:100dvh;display:flex;flex-direction:column;background:#4a0a1c}
.r-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--vinho);color:var(--creme);flex-wrap:wrap}
.r-bar .ttl{font-family:var(--serif);font-size:20px;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-bar .grp{display:flex;align-items:center;gap:4px}
.r-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--creme);background:rgba(255,242,235,.12)}
.r-btn:hover{background:rgba(255,242,235,.28)}
.r-btn:disabled{opacity:.35}
.r-page{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:0 6px}
.r-page input{width:54px;height:34px;border-radius:10px;border:0;text-align:center;background:var(--creme);color:var(--vinho);font-weight:600}
#pdfwrap{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:14px;background:#5d1128;touch-action:pan-x pan-y pinch-zoom;position:relative}
#pdfwrap canvas{background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.45);border-radius:2px;max-width:none}
.r-msg{color:var(--creme);text-align:center;margin:auto;padding:20px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,242,235,.25);border-top-color:var(--creme);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{position:relative;background:var(--vinho);color:var(--creme);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;overflow:hidden}
.auth-art .fl{width:96px;margin-bottom:10px}
.auth-art h1{font-size:54px;line-height:.95}
.auth-art p{opacity:.9;margin-top:14px}
.auth-art .waves{position:absolute;left:0;right:0;bottom:-20px;height:46%}
.auth-form{display:grid;place-items:center;padding:30px;background:linear-gradient(180deg,#FACDD8,#FDE8EA)}
.auth-box{width:min(420px,100%);background:rgba(255,255,255,.65);border-radius:26px;padding:30px;box-shadow:0 20px 50px rgba(153,11,48,.15)}
.tabs{display:flex;background:rgba(153,11,48,.08);border-radius:999px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;height:38px;border-radius:999px;font-weight:600;font-size:13.5px}
.tabs button.on{background:var(--vinho);color:var(--creme)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:12.5px;font-weight:600}
.err{background:#fde3e8;color:#a00022;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.link{color:var(--pink);font-weight:600;font-size:13px;text-decoration:underline;cursor:pointer}

/* ---------- Toast / modal ---------- */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{background:var(--vinho);color:var(--creme);padding:13px 18px;border-radius:14px;font-size:13.5px;box-shadow:0 10px 26px rgba(0,0,0,.28);max-width:340px;animation:up .25s}
.toast.warn{background:var(--laranja)}.toast.err{background:#b00020}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.modal-bg{position:fixed;inset:0;background:rgba(74,10,28,.55);display:grid;place-items:center;z-index:150;padding:16px;overflow:auto}
.modal{background:var(--quente);border-radius:24px;padding:24px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.modal.wide{width:min(760px,100%)}
.modal h2{font-size:28px;margin-bottom:14px}

const BOOK_SEL = '*, category:categories(id,name,slug)';
async function loadCats() {
  const { data } = await sb.from('categories').select('*').order('sort_order').order('name');
  state.cats = data || [];
}
const catById = id => state.cats.find(c => c.id === id);
const topCats = () => state.cats.filter(c => !c.parent_id);
const childCats = id => state.cats.filter(c => c.parent_id === id);
function descendantIds(id) { const out = [id]; childCats(id).forEach(c => out.push(...descendantIds(c.id))); return out; }
function catOptions(selected, placeholder = 'Sem categoria') {
  const opt = (c, d) => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${'— '.repeat(d)}${esc(c.name)}</option>` + childCats(c.id).map(k => opt(k, d + 1)).join('');
  return `<option value="">${esc(placeholder)}</option>` + topCats().map(c => opt(c, 0)).join('');
}
function catIcon(c, size = 34) {
  return c?.image_path ? `<img src="${esc(coverUrl(c.image_path))}" alt="">` : ic(c?.icon || 'book', size);
}
async function loadFavs() {
  state.favs = new Set();
  if (!state.session) return;
  const { data } = await sb.from('favorites').select('book_id');
  (data || []).forEach(r => state.favs.add(r.book_id));
}

async function fetchBooks({ q, cats, order = 'recent', from = 0, to = 23, featured, downloadOnly } = {}) {
  let query = sb.from('books').select(BOOK_SEL, { count: 'exact' }).eq('status', 'published');
  if (cats?.length) query = query.in('category_id', cats);
  if (featured) query = query.eq('featured', true);
  if (downloadOnly) query = query.eq('allow_download', true);
  if (q) {
    const s = q.replace(/[,()%*\\]/g, ' ').trim();
    if (s) {
      const { data: cm } = await sb.from('categories').select('id').ilike('name', `%${s}%`);
      const ids = (cm || []).map(c => c.id);
      query = query.or(`title.ilike.%${s}%,author.ilike.%${s}%${ids.length ? `,category_id.in.(${ids.join(',')})` : ''}`);
    }
  }
  if (order === 'popular') query = query.order('views', { ascending: false }).order('created_at', { ascending: false });
  else if (order === 'title') query = query.order('title', { ascending: true });
  else query = query.order('created_at', { ascending: false });
  const { data, count, error } = await query.range(from, to);
  if (error) throw error;
  return { data: data || [], count: count || 0 };
}

async function init() {
  if (!configured) { renderSetup(); return; }
  sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  await Promise.all([loadProfile(), loadCats()]);
  await loadFavs();
  sb.auth.onAuthStateChange(async (ev, s) => {
    if (ev === 'TOKEN_REFRESHED') { state.session = s; return; }
    const changed = (s?.user?.id || null) !== (state.session?.user?.id || null);
    state.session = s;
    if (ev === 'PASSWORD_RECOVERY') setTimeout(promptNewPassword, 300);
    if (changed) { await loadProfile(); await loadFavs(); state.shellKey = null; route(); }
  });
  window.addEventListener('hashchange', route);
  document.addEventListener('click', globalClick);
  document.addEventListener('keydown', readerKeys);
  route();
}

function wireShell() {
  const side = $('#side'), scrim = $('#scrim');
  const toggle = o => { side.classList.toggle('open', o); scrim.classList.toggle('open', o); };
  $('#burger').onclick = () => toggle(!side.classList.contains('open'));
  scrim.onclick = () => toggle(false);
  side.addEventListener('click', e => { if (e.target.closest('a[href^="#"]')) toggle(false); });
  const ib = $('#install-btn'); if (ib) ib.onclick = installApp;
  const mb = $('#me-btn'); if (mb) mb.onclick = () => $('#me-pop').classList.toggle('hidden');
  const lo = $('#logout-btn'); if (lo) lo.onclick = async () => { await sb.auth.signOut(); toast('Você saiu da conta.'); };
  $('#search-form').onsubmit = e => { e.preventDefault(); const v = $('#q').value.trim(); go('#/busca' + (v ? '?q=' + encodeURIComponent(v) : '')); };
  $('#q').addEventListener('input', debounce(() => { const v = $('#q').value.trim(); if (v.length >= 2) location.replace('#/busca?q=' + encodeURIComponent(v)); }, 350));
  $('#bell').onclick = async () => {
    const pop = $('#bell-pop');
    if (!pop.classList.contains('hidden')) { pop.classList.add('hidden'); return; }
    pop.classList.remove('hidden'); pop.innerHTML = '<h4>Novidades</h4><small style="padding:6px 8px;display:block">Carregando...</small>';
    try {
      const { data } = await fetchBooks({ to: 4 });

    } catch (e) { pop.innerHTML = '<small style="padding:8px;display:block">Não foi possível carregar.</small>'; }
  };
}

/* ---------- eventos globais ---------- */
async function globalClick(e) {
  const pop = $('#me-pop'); if (pop && !e.target.closest('#me-btn') && !e.target.closest('#me-pop')) pop.classList.add('hidden');
  const bp = $('#bell-pop'); if (bp && !e.target.closest('#bell') && !e.target.closest('#bell-pop')) bp.classList.add('hidden');
  const sc = e.target.closest('[data-scroll]');
  if (sc) { const rail = sc.parentElement.querySelector('.rail'); rail.scrollBy({ left: rail.clientWidth * .85 * Number(sc.dataset.scroll), behavior: 'smooth' }); return; }
  const fv = e.target.closest('[data-fav]');
  if (fv) { e.preventDefault(); e.stopPropagation(); toggleFav(fv.dataset.fav); }
}
async function toggleFav(id) {
  if (!state.session) { toast('Entre na sua conta para favoritar livros.', 'warn'); state.next = location.hash; go('#/login'); return; }
  const on = state.favs.has(id);
  on ? state.favs.delete(id) : state.favs.add(id);
  $$(`[data-fav="${id}"]`).forEach(b => b.classList.toggle('on', !on));
  const { error } = on ? await sb.from('favorites').delete().match({ user_id: state.session.user.id, book_id: id })
    : await sb.from('favorites').insert({ user_id: state.session.user.id, book_id: id });
  if (error) { on ? state.favs.add(id) : state.favs.delete(id); $$(`[data-fav="${id}"]`).forEach(b => b.classList.toggle('on', on)); toast(errMsg(error), 'err'); }
  else if (!on) toast('Adicionado aos favoritos.');
  const fp = $('#fav-grid'); if (on && fp) { const c = fp.querySelector(`[data-fav="${id}"]`)?.closest('.bk'); c && c.remove(); }
}

/* ---------- roteador ---------- */
async function route() {
  if (!configured) return renderSetup();
  const my = ++routeToken;
  if (R.pdf) { try { R.pdf.destroy(); } catch (e) { } R.pdf = null; }
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?');
  const params = new URLSearchParams(qs || '');
  const parts = path.split('/').filter(Boolean);
  const live = () => my === routeToken;
  try {
    if (parts[0] === 'login') return viewLogin(params);
    if (parts[0] === 'ler') return viewReader(parts[1], live);
    if (parts[0] === 'admin') {
      if (!state.session) { state.next = location.hash; return go('#/login'); }
      if (!isAdmin()) { toast('Acesso restrito a administradores.', 'err'); return go('#/'); }
      renderShell('admin'); setActive('#/' + path.replace(/^\//, ''));
      setView(skeleton(3));
      return adminRoute(parts.slice(1), params, live);
    }
    renderShell('public'); setActive('#' + (path || '/'));
    const qi = $('#q'); if (qi && parts[0] !== 'busca') qi.value = '';
    setView(skeleton());
    const views = { '': viewHome, categorias: viewCategories, categoria: viewCategory, livro: viewBook, busca: viewSearch, favoritos: viewFavorites, 'meus-livros': viewHistory, sobre: viewAbout, ajuda: viewHelp };
    const fn = views[parts[0] || ''] || viewHome;
    await fn(parts[1], params, live);
  } catch (e) {
    console.error(e);
    if (live()) setView(`<div class="empty">${flower()}<b>Ops, algo deu errado</b>${esc(errMsg(e))}<div style="margin-top:14px"><button class="btn btn-dark" onclick="route()">Tentar de novo</button></div></div>`);
  }
}

async function getFile(bookId) {
  const { data, error } = await sb.from('book_files').select('*').eq('book_id', bookId).maybeSingle();
  if (error) throw error; if (!data) throw new Error('Arquivo PDF não encontrado para este livro.');
  return data;
}
async function downloadBook(id) {
  if (!state.session) { toast('Entre na sua conta para baixar.', 'warn'); state.next = location.hash; return go('#/login'); }
  try {
    const { data: b } = await sb.from('books').select('title,allow_download,source,drive_file_id').eq('id', id).single();
    if (!b.allow_download) return toast('O download deste livro não está liberado.', 'warn');
    if (b.source === 'drive') { window.open(driveDownload(b.drive_file_id), '_blank', 'noopener'); return toast('Download aberto em uma nova aba.'); }
    const f = await getFile(id);
    const { data, error } = await sb.storage.from('books').createSignedUrl(f.storage_path, 120, { download: (b.title || 'livro').replace(/[\\/:*?"<>|]+/g, ' ') + '.pdf' });
    if (error) throw error;
    const a = document.createElement('a'); a.href = data.signedUrl; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    toast('Download iniciado.');
  } catch (e) { toast(errMsg(e), 'err'); }
}

async function viewCategory(id, params, live) {

  if (!c) return setView(emptyBlock('Categoria não encontrada', 'Ela pode ter sido removida.'));

function pager(page, count, size, base) {

  return `<div class="pager">${page > 1 ? `<a class="btn btn-ghost btn-sm" href="${href(page - 1)}">${ic('chevL', 16)} Anterior</a>` : ''}<span>Página ${page} de ${pages}</span>${page < pages ? `<a class="btn btn-ghost btn-sm" href="${href(page + 1)}">Próxima ${ic('chevR', 16)}</a>` : ''}</div>`;
}

function readerKeys(e) {
  if (state.shellKey !== 'reader' || !R.pdf || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;

  if (e.key === 'ArrowLeft' || e.key === 'PageUp') readerGo(R.page - 1);
}
async function viewReader(id, live) {
  if (!state.session) { state.next = location.hash; toast('Entre na sua conta para ler.', 'warn'); return go('#/login'); }
  state.shellKey = 'reader';
  $('#app').innerHTML = `<div class="reader"><div class="r-bar">

      <div class="r-page"><input id="r-num" type="number" min="1" value="1" aria-label="Página"> <span>/ <b id="r-total">–</b></span></div>
      <button class="r-btn" id="r-next" aria-label="Próxima página">${ic('chevR', 20)}</button></div>
    <div class="grp"><button class="r-btn" id="r-zo" aria-label="Diminuir">${ic('zoomOut', 20)}</button><button class="r-btn" id="r-zi" aria-label="Ampliar">${ic('zoomIn', 20)}</button>
      <button class="r-btn" id="r-fit" title="Ajustar à largura" aria-label="Ajustar à largura">${ic('devices', 20)}</button>
      <button class="r-btn" id="r-fs" aria-label="Tela cheia">${ic('full', 20)}</button>
      <button class="r-btn hidden" id="r-dl" aria-label="Baixar">${ic('download', 20)}</button></div></div>
    <div id="pdfwrap"><div class="r-msg"><div class="spin"></div>Abrindo livro...</div></div></div>`;
  try {
    const { data: b, error } = await sb.from('books').select('id,title,allow_download,source,drive_file_id').eq('id', id).maybeSingle();
    if (error) throw error; if (!b) throw new Error('Livro não encontrado.');
    if (b.source === 'drive') return readDrive(b, live);
    const f = await getFile(id);
    const { data: su, error: se } = await sb.storage.from('books').createSignedUrl(f.storage_path, 3600);
    if (se) throw se;
    const { data: h } = await sb.from('reading_history').select('last_page').match({ user_id: state.session.user.id, book_id: id }).maybeSingle();
    if (!live()) return;
    $('#r-title').textContent = b.title;
    if (b.allow_download) { const d = $('#r-dl'); d.classList.remove('hidden'); d.onclick = () => downloadBook(id); }
    R.pdf = await pdfjsLib.getDocument({ url: su.signedUrl, disableAutoFetch: true, disableStream: false, rangeChunkSize: 262144 }).promise;
    if (!live()) { R.pdf.destroy(); R.pdf = null; return; }
    R.id = id; R.total = R.pdf.numPages; R.page = Math.min(Math.max(1, h?.last_page || 1), R.total); R.fit = true; R.zoom = 1; R.scale = 1; R.busy = false;
    $('#r-total').textContent = R.total; $('#r-num').max = R.total;
    sb.rpc('increment_views', { p_book: id });
    saveProgress();
    wireReader(); renderPage();
  } catch (e) {
    console.error(e);
    const w = $('#pdfwrap'); if (w) w.innerHTML = `<div class="r-msg"><b style="font-family:var(--serif);font-size:24px;font-weight:400">Não foi possível abrir o livro</b><p>${esc(errMsg(e))}</p><a class="btn btn-soft" href="#/livro/${esc(id)}">Voltar</a></div>`;
  }
}
const saveProgress = debounce(() => { if (R.pdf && state.session) sb.from('reading_history').upsert({ user_id: state.session.user.id, book_id: R.id, last_page: R.page, updated_at: new Date().toISOString() }); }, 600);
function readerGo(p) { if (!R.pdf) return; p = Math.min(Math.max(1, p), R.total); if (p === R.page) return; R.page = p; $('#r-num').value = p; renderPage(); saveProgress(); $('#pdfwrap').scrollTo(0, 0); }
function wireReader() {
  $('#r-prev').onclick = () => readerGo(R.page - 1);
  $('#r-next').onclick = () => readerGo(R.page + 1);
  $('#r-num').onchange = e => readerGo(parseInt(e.target.value) || R.page);
  $('#r-zi').onclick = () => { R.fit = false; R.zoom = Math.min(5, R.scale * 1.25); renderPage(); };
  $('#r-zo').onclick = () => { R.fit = false; R.zoom = Math.max(.3, R.scale / 1.25); renderPage(); };
  $('#r-fit').onclick = () => { R.fit = true; renderPage(); };
  const fsBtn = $('#r-fs'), root = document.documentElement;
  if (!root.requestFullscreen) fsBtn.classList.add('hidden');
  fsBtn.onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('.reader').requestFullscreen();
  const w = $('#pdfwrap'); let sx = 0, sy = 0;
  w.addEventListener('touchstart', e => { sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY; }, { passive: true });
  w.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (R.fit && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) readerGo(R.page + (dx < 0 ? 1 : -1)); }, { passive: true });
  window.onresize = debounce(() => { if (R.pdf && R.fit) renderPage(); }, 200);
}
async function renderPage() {
  if (!R.pdf) return;
  if (R.busy) { R.again = true; return; }
  R.busy = true;
  try {
    const page = await R.pdf.getPage(R.page), wrap = $('#pdfwrap'); if (!wrap) return;
    const base = page.getViewport({ scale: 1 });
    R.scale = R.fit ? Math.min((wrap.clientWidth - 28) / base.width, 2.4) : R.zoom;
    const vp = page.getViewport({ scale: R.scale }), dpr = window.devicePixelRatio || 1;
    const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr);
    cv.style.width = vp.width + 'px'; cv.style.height = vp.height + 'px';
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
    wrap.innerHTML = ''; wrap.appendChild(cv);
    $('#r-prev').disabled = R.page <= 1; $('#r-next').disabled = R.page >= R.total;
  } catch (e) { console.error(e); const w = $('#pdfwrap'); if (w && R.pdf) w.innerHTML = `<div class="r-msg">Erro ao desenhar a página.</div>`; }
  R.busy = false;
  if (R.again) { R.again = false; renderPage(); }
}

}

/* ---------- upload com progresso (XHR permite progresso e cancelamento) ---------- */
async function xhrUpload(bucket, path, file, type, onProgress, onXhr) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('Sessão expirada. Entre novamente.');
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest(); onXhr && onXhr(xhr);
    xhr.open('POST', `${cfg.SUPABASE_URL}/storage/v1/object/${bucket}/${path.split('/').map(encodeURIComponent).join('/')}`);
    xhr.setRequestHeader('Authorization', 'Bearer ' + session.access_token);
    xhr.setRequestHeader('apikey', cfg.SUPABASE_ANON_KEY);
    xhr.setRequestHeader('x-upsert', 'false');
    xhr.setRequestHeader('cache-control', 'max-age=3600');
    xhr.setRequestHeader('Content-Type', type);
    xhr.upload.onprogress = e => e.lengthComputable && onProgress && onProgress(e.loaded / e.total);
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) return resolve();
      let m = 'Falha no envio (' + xhr.status + ').';
      try { const j = JSON.parse(xhr.responseText); m = j.message || j.error || m; } catch (e) { }
      if (/exceeded the maximum|too large|413/i.test(m + xhr.status)) m = 'Arquivo maior que o limite do Storage (50 MB no plano gratuito).';
      if (/row-level security|unauthorized|403/i.test(m + xhr.status)) m = 'Sem permissão para enviar. Verifique se sua conta é administradora.';
      reject(new Error(m));
    };
    xhr.onerror = () => reject(new Error('Falha de rede durante o envio.'));
    xhr.onabort = () => reject(Object.assign(new Error('Cancelado'), { cancelled: true }));
    xhr.send(file);
  });
}
async function coverFromPdf(file) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  try {
    const p = await pdf.getPage(1), v0 = p.getViewport({ scale: 1 }), vp = p.getViewport({ scale: 420 / v0.width });
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await p.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    return await new Promise(r => cv.toBlob(r, 'image/jpeg', .82));
  } finally { pdf.destroy(); }
}

async function filesFromDrop(dt) {
  const out = [];
  const walk = async entry => {
    if (entry.isFile) await new Promise(r => entry.file(f => { out.push(f); r(); }, r));
    else if (entry.isDirectory) {
      const rd = entry.createReader(); let batch;
      do { batch = await new Promise(r => rd.readEntries(r, () => r([]))); for (const en of batch) await walk(en); } while (batch.length);
    }
  };
  const entries = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length) { for (const e of entries) await walk(e); return out; }
  return [...dt.files];
}

function updateSummary() {

async function startUpload() {
  if (U.running) return;
  const queue = U.items.filter(i => i.state === 'pending');
  if (!queue.length) return toast('Não há arquivos aguardando envio.', 'warn');
  const bad = queue.filter(i => !i.title.trim());
  if (bad.length) { toast(`${bad.length} arquivo(s) estão sem título.`, 'err'); return; }
  U.running = true; U.cancelled = false; updateSummary();
  let idx = 0;
  const worker = async () => { while (!U.cancelled) { const it = queue[idx++]; if (!it) break; await uploadItem(it); } };
  await Promise.all(Array.from({ length: Math.min(3, queue.length) }, worker));
  U.running = false; updateSummary();
  const ok = queue.filter(i => i.state === 'done').length, bd = queue.filter(i => i.state === 'error').length;
  if (U.cancelled) toast('Envio cancelado. Os arquivos restantes continuam na lista.', 'warn');
  else if (bd) toast(`${ok} enviado(s), ${bd} com erro. Use “Tentar falhos de novo”.`, 'err');
  else toast(`${ok} livro(s) enviado(s) com sucesso!`);
}
function cancelAll() {
  if (!U.running) return toast('Nenhum envio em andamento.', 'warn');
  U.cancelled = true; U.items.forEach(i => i.xhr && i.state === 'uploading' && i.xhr.abort());
}
async function uploadItem(it) {
  it.state = 'uploading'; it.error = ''; it.progress = it.storagePath ? 95 : 0; it.xhr = null; updateRow(it); updateSummary();
  try {
    if (!it.storagePath) {
      const path = `${it.id}.pdf`;
      await xhrUpload('books', path, it.file, 'application/pdf', p => { it.progress = Math.round(p * 94); updateRow(it); updateSummary(); }, x => it.xhr = x);
      it.storagePath = path;
    }
    it.progress = 96; updateRow(it);
    let coverPath = it.coverPath || null;
    if (!coverPath) {
      let blob = it.cover, ext = it.cover ? extOf(it.cover) : 'jpg';
      if (!blob && U.defaults.autoCover) { try { blob = await coverFromPdf(it.file); } catch (e) { blob = null; } }
      if (blob) {
        coverPath = `books/${it.id}.${ext}`;
        const { error } = await sb.storage.from('covers').upload(coverPath, blob, { upsert: true, contentType: blob.type || 'image/jpeg' });
        if (error) { if (it.cover) throw error; coverPath = null; }
        it.coverPath = coverPath;
      }
    }
    if (!it.bookId) {
      const { data, error } = await sb.from('books').insert({ title: it.title.trim(), author: it.author.trim() || null, description: it.description.trim() || null, category_id: it.categoryId || null, cover_path: coverPath, status: it.status, featured: it.featured, allow_download: it.allow_download }).select('id').single();
      if (error) throw error; it.bookId = data.id;
    }
    const { error: fe } = await sb.from('book_files').insert({ book_id: it.bookId, storage_path: it.storagePath, original_name: it.file.name, size_bytes: it.file.size, mime_type: 'application/pdf' });
    if (fe && fe.code !== '23505') throw fe;
    it.state = 'done'; it.progress = 100;
  } catch (e) {
    if (e.cancelled) { it.state = 'cancelled'; it.progress = 0; it.error = ''; }
    else { it.state = 'error'; it.error = errMsg(e); }
  }
  it.xhr = null; updateRow(it); updateSummary();
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  text = text.replace(/^\ufeff/, '');
  const first = text.split(/\r?\n/)[0] || '', delim = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(c => c.trim())) rows.push(row); row = []; }
    else cur += ch;
  }
  row.push(cur); if (row.some(c => c.trim())) rows.push(row);
  return rows;
}
async function importCsv(file) {
  if (!U.items.length) return toast('Adicione os PDFs primeiro; depois importe a planilha.', 'warn');
  const rows = parseCSV(await file.text());
  if (rows.length < 2) return toast('A planilha está vazia.', 'warn');
  const alias = { arquivo: 'file', 'nome do arquivo': 'file', 'arquivo pdf': 'file', pdf: 'file', filename: 'file', file: 'file', titulo: 'title', title: 'title', autor: 'author', author: 'author', categoria: 'cat', category: 'cat', descricao: 'desc', description: 'desc' };
  const head = rows[0].map(h => alias[norm(h)] || null);
  if (!head.includes('file')) return toast('A planilha precisa da coluna "arquivo" com o nome do PDF.', 'err');
  const byKey = new Map(U.items.map(i => [fileKey(i.file.name), i]));
  let matched = 0, missCat = new Set(), unmatched = [];
  const pending = [];
  for (const r of rows.slice(1)) {
    const rec = {}; head.forEach((k, i) => { if (k) rec[k] = (r[i] || '').trim(); });
    const it = byKey.get(fileKey(rec.file || ''));
    if (!it) { unmatched.push(rec.file); continue; }
    if (['done', 'uploading'].includes(it.state)) continue;
    matched++;
    if (rec.title) it.title = rec.title; if (rec.author) it.author = rec.author; if (rec.desc) it.description = rec.desc;
    if (rec.cat) pending.push([it, rec.cat]);
  }
  const create = $('#d-newcats')?.checked;
  for (const [it, name] of pending) {
    let c = state.cats.find(x => norm(x.name) === norm(name));
    if (!c && create) {
      const { data, error } = await sb.from('categories').insert({ name, slug: slugify(name) + '-' + Math.random().toString(36).slice(2, 6), sort_order: state.cats.length }).select().single();
      if (!error) { c = data; state.cats.push(c); }
    }
    if (c) it.categoryId = c.id; else missCat.add(name);
  }
  renderRows(); updateSummary();
  const d = $('#d-cat'); if (d) d.innerHTML = catOptions(U.defaults.categoryId, 'Escolha uma categoria');
  toast(`CSV aplicado a ${matched} arquivo(s).` + (unmatched.length ? ` ${unmatched.length} linha(s) sem PDF correspondente.` : '') + (missCat.size ? ` Categorias não encontradas: ${[...missCat].slice(0, 3).join(', ')}.` : ''), unmatched.length || missCat.size ? 'warn' : 'ok');
}

/* =====================================================================
   IMPORTAR DO GOOGLE DRIVE
   O PDF continua no Drive; o app guarda só o link e abre a prévia do Drive dentro do leitor.
   ===================================================================== */
const D = { items: [], saving: false, defaults: { categoryId: '', status: 'published', allow_download: true, featured: false, createCats: true } };
const D_STATE = { pending: ['Aguardando', 'b-wait'], saving: ['Salvando', 'b-up'], done: ['Salvo ✓', 'b-ok'], error: ['Erro', 'b-err'] };
const GKEY = () => (cfg.GOOGLE_API_KEY || '').trim();

function dNewItem(o) {
  return { id: crypto.randomUUID(), driveId: o.driveId, title: o.title || '', author: o.author || '', description: o.description || '', catName: o.catName || '', categoryId: o.categoryId ?? D.defaults.categoryId, state: 'pending', error: '', access: '' };
}
function dAdd(list) {
  let dup = 0, bad = 0;
  for (const o of list) {
    if (!o.driveId) { bad++; continue; }
    if (D.items.some(i => i.driveId === o.driveId)) { dup++; continue; }
    D.items.push(dNewItem(o));
  }
  dRender(); dSummary();
  if (bad) toast(`${bad} linha(s) sem link válido do Drive foram ignoradas.`, 'warn');
  if (dup) toast(`${dup} link(s) repetido(s) ignorado(s).`, 'warn');
  return list.length - bad - dup;
}
function dParseText(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const c = line.split(/\t|;|\|/).map(x => x.trim());
    return { driveId: driveIsFolder(c[0]) ? null : driveId(c[0]), title: c[1] || '', author: c[2] || '', catName: c[3] || '', description: c[4] || '' };
  });
}

async function gFetch(url) {
  const r = await fetch(url);
  if (!r.ok) { let m = 'Falha ao consultar o Google (' + r.status + ').'; try { const j = await r.json(); m = j.error?.message || m; } catch (e) { } throw new Error(m); }
  return r.json();
}
async function dFillNames(items) {
  if (!GKEY()) return;
  const todo = items.filter(i => !i.title); let k = 0;
  await Promise.all(Array.from({ length: 6 }, async () => {
    while (k < todo.length) {
      const it = todo[k++];
      try { const j = await gFetch(`https://www.googleapis.com/drive/v3/files/${it.driveId}?fields=name&supportsAllDrives=true&key=${encodeURIComponent(GKEY())}`); it.title = titleFromName(j.name || ''); }
      catch (e) { it.error = 'Não foi possível ler o nome: ' + errMsg(e); }
    }
  }));
  dRender();
}
async function dListFolder(folderId, { sub, catName = '', depth = 0, out = [], onCount }) {
  let token = '';
  do {
    const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
    const j = await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&pageSize=1000&fields=nextPageToken,files(id,name,mimeType)&supportsAllDrives=true&includeItemsFromAllDrives=true&key=${encodeURIComponent(GKEY())}${token ? '&pageToken=' + token : ''}`);
    for (const f of j.files || []) {
      if (f.mimeType === 'application/pdf') { out.push({ driveId: f.id, title: titleFromName(f.name), catName }); onCount && onCount(out.length); }
      else if (f.mimeType === 'application/vnd.google-apps.folder' && sub && depth < 4) await dListFolder(f.id, { sub, catName: depth === 0 ? f.name : catName || f.name, depth: depth + 1, out, onCount });
    }
    token = j.nextPageToken || '';
  } while (token);
  return out;
}

/* categorias por nome (cria se permitido) */
async function dResolveCats(items, create) {
  const missing = new Set();
  for (const it of items) {
    if (!it.catName) continue;
    let c = state.cats.find(x => norm(x.name) === norm(it.catName));
    if (!c && create) {
      const { data, error } = await sb.from('categories').insert({ name: it.catName, slug: slugify(it.catName) + '-' + Math.random().toString(36).slice(2, 6), sort_order: state.cats.length }).select().single();
      if (!error) { c = data; state.cats.push(c); }
    }
    if (c) it.categoryId = c.id; else missing.add(it.catName);
  }
  return missing;
}

    <div class="field"><label>Categoria</label><select id="dd-cat">${catOptions(d.categoryId, 'Escolha uma categoria')}</select></div>
    <button class="btn btn-pink btn-sm" id="dd-apply">Aplicar categoria a todos</button>
    <div class="field"><label>Status</label><select id="dd-status"><option value="published" ${d.status === 'published' ? 'selected' : ''}>Publicar</option><option value="draft" ${d.status === 'draft' ? 'selected' : ''}>Rascunho</option></select></div>
    <label class="check"><input type="checkbox" id="dd-dl" ${d.allow_download ? 'checked' : ''}> Permitir download</label>
    <label class="check"><input type="checkbox" id="dd-feat" ${d.featured ? 'checked' : ''}> Destaque</label>
    <label class="check"><input type="checkbox" id="dd-newcats" ${d.createCats ? 'checked' : ''}> Criar categorias novas</label></div></div>

  <div class="panel"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
    <h2 style="margin:0">Livros <span id="d-count" style="font-size:16px;font-family:var(--sans)"></span></h2>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-pink" id="d-save">${ic('check', 18)} Salvar na biblioteca</button>
      <button class="btn btn-ghost btn-sm" id="d-check">${ic('shield', 16)} Verificar acesso</button>
      <button class="btn btn-ghost btn-sm" id="d-retry">${ic('retry', 16)} Tentar falhos de novo</button>
      <button class="btn btn-ghost btn-sm" id="d-clean">Remover salvos</button>
      <button class="btn btn-danger btn-sm" id="d-clear">Limpar lista</button></div></div>
    <div class="bar"><i id="d-bar" style="width:0"></i></div><p id="d-text" style="font-size:12.5px;margin:6px 0 10px"></p>
    <div class="up-head"><span>Link</span><span>Título</span><span>Autor</span><span>Categoria</span><span>Situação</span><span></span></div>
    <div id="d-rows"></div></div>`);

  const $d = id => $(id);
  $d('#dd-cat').onchange = e => d.categoryId = e.target.value;
  $d('#dd-status').onchange = e => d.status = e.target.value;
  $d('#dd-dl').onchange = e => d.allow_download = e.target.checked;
  $d('#dd-feat').onchange = e => d.featured = e.target.checked;
  $d('#dd-newcats').onchange = e => d.createCats = e.target.checked;
  $d('#dd-apply').onclick = () => { const c = $d('#dd-cat').value; if (!c) return toast('Escolha uma categoria primeiro.', 'warn'); const t = D.items.filter(i => i.state !== 'done'); t.forEach(i => i.categoryId = c); dRender(); toast(`Categoria aplicada a ${t.length} livro(s).`); };

  $d('#dr-add').onclick = async () => {
    const list = dParseText($d('#dr-text').value);
    if (!list.length) return toast('Cole ao menos um link.', 'warn');
    if (list.some(o => !o.driveId)) toast('Há linhas que não parecem links de arquivo do Drive. Links de pasta devem ir em “Importar uma pasta”.', 'warn');
    const before = D.items.length;
    const miss = await dResolveCats(list.filter(o => o.catName), d.createCats);
    const n = dAdd(list);
    if (n) { $d('#dr-text').value = ''; toast(`${n} link(s) adicionado(s).`); await dFillNames(D.items.slice(before)); }
    if (miss.size) toast(`Categorias não encontradas: ${[...miss].slice(0, 3).join(', ')}.`, 'warn');
  };
  $d('#dr-csv').onclick = () => $d('#dr-csv-in').click();
  $d('#dr-csv-in').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const rows = parseCSV(await f.text()); if (rows.length < 2) return toast('A planilha está vazia.', 'warn');
    const alias = { link: 'link', url: 'link', drive: 'link', 'link do drive': 'link', arquivo: 'link', titulo: 'title', title: 'title', autor: 'author', author: 'author', categoria: 'cat', category: 'cat', descricao: 'desc', description: 'desc' };
    const head = rows[0].map(h => alias[norm(h)] || null);
    if (!head.includes('link')) return toast('A planilha precisa de uma coluna "link".', 'err');
    const list = rows.slice(1).map(r => { const o = {}; head.forEach((k, i) => { if (k) o[k] = (r[i] || '').trim(); }); return { driveId: driveId(o.link), title: o.title, author: o.author, catName: o.cat, description: o.desc }; });
    const before = D.items.length; const miss = await dResolveCats(list.filter(o => o.catName && o.driveId), d.createCats);
    const n = dAdd(list); toast(`${n} livro(s) importado(s) da planilha.`); await dFillNames(D.items.slice(before));
    if (miss.size) toast(`Categorias não encontradas: ${[...miss].slice(0, 3).join(', ')}.`, 'warn');
  };
  const lb = $d('#dr-list');
  if (lb) lb.onclick = async () => {
    const id = driveId($d('#dr-folder').value); const msg = $d('#dr-folder-msg');
    if (!id || !driveIsFolder($d('#dr-folder').value)) return toast('Cole o link de uma pasta do Drive.', 'warn');
    lb.disabled = true; msg.textContent = 'Listando...';
    try {
      const list = await dListFolder(id, { sub: $d('#dr-sub').checked, onCount: n => { msg.textContent = `Listando... ${n} PDF(s) encontrados`; } });
      if (!list.length) msg.textContent = 'Nenhum PDF encontrado. Verifique se a pasta está compartilhada como “Qualquer pessoa com o link”.';
      else { await dResolveCats(list.filter(o => o.catName), d.createCats); const n = dAdd(list); msg.textContent = `${list.length} PDF(s) encontrados, ${n} novo(s) adicionado(s) à lista.`; }
    } catch (e) { msg.textContent = ''; toast(errMsg(e), 'err'); }
    lb.disabled = false;
  };

  $d('#d-save').onclick = dSave;
  $d('#d-check').onclick = dCheckAccess;
  $d('#d-retry').onclick = () => { D.items.forEach(i => { if (i.state === 'error') { i.state = 'pending'; i.error = ''; } }); dRender(); dSave(); };
  $d('#d-clean').onclick = () => { D.items = D.items.filter(i => i.state !== 'done'); dRender(); dSummary(); };
  $d('#d-clear').onclick = async () => { if (D.saving) return; if (!D.items.length || await confirmBox('Remover todos os links da lista? (Livros já salvos não são afetados.)', { ok: 'Limpar' })) { D.items = []; dRender(); dSummary(); } };

  const rows = $d('#d-rows');
  const itOf = el => { const r = el.closest('.uprow'); return r && D.items.find(i => i.id === r.dataset.id); };
  rows.addEventListener('input', e => { const it = itOf(e.target); if (it && e.target.dataset.f) it[e.target.dataset.f] = e.target.value; });
  rows.addEventListener('change', e => { const it = itOf(e.target); if (it && e.target.dataset.f) it[e.target.dataset.f] = e.target.value; });
  rows.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return; const it = itOf(b); if (!it) return;
    if (b.dataset.act === 'remove') { D.items = D.items.filter(x => x !== it); b.closest('.uprow').remove(); dSummary(); }
    if (b.dataset.act === 'retry') { it.state = 'pending'; it.error = ''; dRowUpdate(it); dSave(); }
  });
  dRender(); dSummary();
}
function dRowHTML(it) {
  const [lab, cls] = D_STATE[it.state];
  const lock = ['saving', 'done'].includes(it.state) ? 'disabled' : '';
  const acc = it.access === 'ok' ? '<span class="badge b-ok">Acessível</span> ' : it.access === 'no' ? '<span class="badge b-warn">Sem acesso público?</span> ' : it.access === 'chk' ? '<span class="badge b-wait">Verificando</span> ' : '';
  return `<div class="uprow" data-id="${it.id}">
    <div class="up-file"><b><a href="${esc(driveView(it.driveId))}" target="_blank" rel="noopener" title="Abrir no Drive">${esc(it.driveId.slice(0, 14))}…</a></b><small>Google Drive</small></div>
    <input class="in" data-f="title" value="${esc(it.title)}" placeholder="Título (obrigatório)" ${lock}>
    <input class="in" data-f="author" value="${esc(it.author)}" placeholder="Autor" ${lock}>
    <select class="in" data-f="categoryId" ${lock}>${catOptions(it.categoryId, 'Sem categoria')}</select>
    <div class="up-state">${acc}<span class="badge ${cls}">${lab}</span><small>${esc(it.error)}</small></div>
    <div class="up-actions"><button class="mini ${it.state === 'error' ? '' : 'hidden'}" data-act="retry" aria-label="Tentar de novo" title="Tentar de novo">${ic('retry', 16)}</button><button class="mini ${it.state === 'saving' ? 'hidden' : ''}" data-act="remove" aria-label="Remover" title="Remover">${ic('x', 16)}</button></div></div>`;
}
function dRender() {
  const r = $('#d-rows'); if (!r) return;
  r.innerHTML = D.items.length ? D.items.map(dRowHTML).join('') : `<div class="empty" style="margin-top:10px">${flower()}<b>Nenhum link na lista</b>Cole links do Drive acima ou liste uma pasta.</div>`;
}
function dRowUpdate(it) { const row = $(`#d-rows .uprow[data-id="${it.id}"]`); if (row) row.outerHTML = dRowHTML(it); dSummary(); }
function dSummary() {
  const n = D.items.length, c = s => D.items.filter(i => i.state === s).length;
  const set = (id, fn) => { const e = $(id); if (e) fn(e); };
  set('#d-count', e => e.textContent = n ? `(${n})` : '');
  set('#d-bar', e => e.style.width = (n ? Math.round(c('done') / n * 100) : 0) + '%');
  set('#d-text', e => e.textContent = n ? `${c('done')} salvo(s), ${c('pending')} aguardando, ${c('error')} com erro.` : 'Nenhum link na lista.');
  set('#d-save', e => e.disabled = D.saving);
}
function dCheckAccess() {
  const todo = D.items.filter(i => i.state !== 'done'); if (!todo.length) return toast('Nada para verificar.', 'warn');
  todo.forEach(i => i.access = 'chk'); dRender();
  let k = 0;
  const probe = it => new Promise(res => { const im = new Image(); const t = setTimeout(() => { im.src = ''; res(false); }, 12000); im.onload = () => { clearTimeout(t); res(im.naturalWidth > 1); }; im.onerror = () => { clearTimeout(t); res(false); }; im.referrerPolicy = 'no-referrer'; im.src = driveThumb(it.driveId); });
  Promise.all(Array.from({ length: 6 }, async () => { while (k < todo.length) { const it = todo[k++]; it.access = (await probe(it)) ? 'ok' : 'no'; dRowUpdate(it); } })).then(() => {
    const bad = todo.filter(i => i.access === 'no').length;
    toast(bad ? `${bad} arquivo(s) parecem não estar públicos. Ajuste o compartilhamento no Drive.` : 'Todos os arquivos estão acessíveis.', bad ? 'warn' : 'ok');
  });
}
async function dSave() {
  if (D.saving) return;
  const queue = D.items.filter(i => i.state === 'pending');
  if (!queue.length) return toast('Não há livros aguardando.', 'warn');
  const noTitle = queue.filter(i => !i.title.trim());
  if (noTitle.length) { toast(`${noTitle.length} livro(s) sem título. Preencha os títulos${GKEY() ? '' : ' (sem a chave do Google o nome do arquivo não pode ser lido)'}.`, 'err'); return; }
  D.saving = true; dSummary();
  try {
    const ids = queue.map(i => i.driveId), existing = new Set();
    for (let k = 0; k < ids.length; k += 100) { const { data } = await sb.from('books').select('drive_file_id').in('drive_file_id', ids.slice(k, k + 100)); (data || []).forEach(r => existing.add(r.drive_file_id)); }
    const fresh = [];
    queue.forEach(it => { if (existing.has(it.driveId)) { it.state = 'error'; it.error = 'Este arquivo já está cadastrado.'; } else fresh.push(it); });
    const d = D.defaults;
    const rec = it => ({ title: it.title.trim(), author: it.author.trim() || null, description: it.description.trim() || null, category_id: it.categoryId || null, status: d.status, featured: d.featured, allow_download: d.allow_download, source: 'drive', drive_file_id: it.driveId, cover_url: driveThumb(it.driveId) });
    for (let k = 0; k < fresh.length; k += 50) {
      const chunk = fresh.slice(k, k + 50); chunk.forEach(i => i.state = 'saving');
      const { error } = await sb.from('books').insert(chunk.map(rec));
      if (!error) chunk.forEach(i => { i.state = 'done'; i.error = ''; });
      else for (const it of chunk) { const r = await sb.from('books').insert(rec(it)); if (r.error) { it.state = 'error'; it.error = errMsg(r.error); } else it.state = 'done'; }
      dRender(); dSummary();
    }
  } catch (e) { queue.forEach(i => { if (i.state === 'saving' || i.state === 'pending') { i.state = 'error'; i.error = errMsg(e); } }); }
  D.saving = false; dRender(); dSummary();
  const ok = queue.filter(i => i.state === 'done').length, bad = queue.filter(i => i.state === 'error').length;
  toast(bad ? `${ok} salvo(s), ${bad} com erro.` : `${ok} livro(s) salvo(s) na biblioteca!`, bad ? 'err' : 'ok');
}

</script>
<script>init();</script>

</body></html>
